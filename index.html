<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Laser Survivor</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      width: 100%;
      height: 100%;
    }

    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
    }

    #unity-canvas {
      background: #231F20;
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
	
  </head>
  <body>
    <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <!-- <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Find It</div>
    </div> -->
  </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/2e1029e716f820f46f2a18d55e39c25c.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/631b36c23c157d6fcff164c0ed8231fa.data.unityweb",
        frameworkUrl: buildUrl + "/8a0ac910ed880038dcffa9c7dd131e94.framework.js.unityweb",
        codeUrl: buildUrl + "/545e036319499d068f7b6534c8f13a32.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Felicity Games",
        productName: "Laser Survivor",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
      };

      let unityInstance;
function updateCanvasSize() {
	  let aspectRatio;

	  if (window.innerHeight > window.innerWidth) {
		// Portrait - 9:16
		aspectRatio = 9 / 16;
	  } else {
		// Landscape - 16:10
		aspectRatio = 16 / 10;
	  }

	  const maxWidth = window.innerWidth;
	  const maxHeight = window.innerHeight;

	  let width = maxWidth;
	  let height = width / aspectRatio;

	  if (height > maxHeight) {
		height = maxHeight;
		width = height * aspectRatio;
	  }

	  canvas.style.width = `${width}px`;
	  canvas.style.height = `${height}px`;
	}

	window.addEventListener("resize", updateCanvasSize);
	window.addEventListener("orientationchange", updateCanvasSize);

	loadingBar.style.display = "block";
	updateCanvasSize();

	const script = document.createElement("script");
	script.src = loaderUrl;
	script.onload = () => {
	  createUnityInstance(canvas, config, (progress) => {
		progressBarFull.style.width = 100 * progress + "%";
	  }).then((instance) => {
		unityInstance = instance;
		//loadingBar.style.display = "none";
		// fullscreenButton.onclick = () => {
		//   unityInstance.SetFullscreen(1);
		// };
	  }).catch((message) => {
		alert(message);
	  });
	};


      document.body.appendChild(script);

    </script>
  </body>
</html>
