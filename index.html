<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>%PRODUCT_NAME%</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: black;
      }
      #unity-canvas {
        display: block;
        background: #000;
        /* Optional: ensure the canvas always fills the viewport even before JS runs */
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Unity loader -->
    <script src="%UNITY_WEBGL_LOADER_URL%"></script>

    <script>
      (function () {
        const canvas = document.getElementById("unity-canvas");

        // Mobile viewport handling
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.head.appendChild(meta);
          canvas.style.position = "fixed";
          document.body.style.textAlign = "left";
        }

        // Build-time substituted URLs & metadata
        const config = {
          dataUrl: "%UNITY_WEBGL_DATA_URL%",
          frameworkUrl: "%UNITY_WEBGL_FRAMEWORK_URL%",
          codeUrl: "%UNITY_WEBGL_CODE_URL%",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "%COMPANY_NAME%",
          productName: "%PRODUCT_NAME%",
          productVersion: "%PRODUCT_VERSION%",
          // We'll handle size manually so it truly tracks the viewport
          matchWebGLToCanvasSize: false
        };

        createUnityInstance(canvas, config).then((unityInstance) => {
          function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            // Keep CSS & backing store in sync
            canvas.style.width = w + "px";
            canvas.style.height = h + "px";
            canvas.width = w;
            canvas.height = h;

            if (unityInstance.Module && unityInstance.Module.setCanvasSize) {
              // For HiDPI you could multiply by devicePixelRatio if you prefer crisper rendering
              unityInstance.Module.setCanvasSize(w, h);
            }
          }

          // Initial + on resize
          resizeCanvas();
          window.addEventListener("resize", resizeCanvas);

          // Optional: ResizeObserver catches CSS/layout-driven changes, too
          if ("ResizeObserver" in window) {
            new ResizeObserver(resizeCanvas).observe(document.body);
          }
        });
      })();
    </script>
  </body>
</html>
