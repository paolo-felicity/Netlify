<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Laser Survivor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: black;
      }
      #unity-canvas {
        display: block;
        background: #000000;
        /* Fill viewport even before JS runs */
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Unity loader -->
    <script src="Build/0fcc1fd7f732daa1c81a79b1bccd96cf.loader.js"></script>

    <script>
      (function () {
        const canvas = document.getElementById("unity-canvas");

        // Mobile viewport handling (same as your Yandex snippet)
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.head.appendChild(meta);
          canvas.style.position = "fixed";
          document.body.style.textAlign = "left";
        }

        // Build-time substituted URLs & metadata (modern tokens)
        const config = {
          dataUrl: "Build/e1e4b0dfbe67597b15dbf37b380366c2.data.unityweb",
          frameworkUrl: "Build/ea8423d205fe7515093b721ddb6f4d1b.framework.js.unityweb",
          codeUrl: "Build/16f88a8e0bcde6edc590847c2fbdb337.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Felicity Games",
          productName: "Laser Survivor",
          productVersion: "1.0.0",
          // We’ll size manually to truly track the viewport
          matchWebGLToCanvasSize: false
        };

        createUnityInstance(canvas, config).then((unityInstance) => {
          function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Keep CSS & backing store in sync
            canvas.style.width  = w + "px";
            canvas.style.height = h + "px";
            canvas.width  = w;
            canvas.height = h;

            if (unityInstance.Module && unityInstance.Module.setCanvasSize) {
              unityInstance.Module.setCanvasSize(w, h);
            }
          }

          // Initial + on resize
          resizeCanvas();
          window.addEventListener("resize", resizeCanvas);

          // Optional: catch layout-driven changes too
          if ("ResizeObserver" in window) {
            new ResizeObserver(resizeCanvas).observe(document.body);
          }
        }).catch((e) => {
          console.error("Unity init failed:", e);
        });
      })();
    </script>
  </body>
</html>
